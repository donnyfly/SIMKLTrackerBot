name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - test
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: donnyfly/simkltrackerbot

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ github.ref_type == 'tag' && format('ghcr.io/donnyfly/simkltrackerbot:{0}', github.ref_name) || format('ghcr.io/donnyfly/simkltrackerbot:{0}', github.ref_name == 'main' && 'latest' || 'test') }}
            ${{ startsWith(github.ref, 'refs/tags/v') && 'ghcr.io/donnyfly/simkltrackerbot:latest' || format('ghcr.io/donnyfly/simkltrackerbot:{0}', github.sha) }}
